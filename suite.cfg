# suite.cfg - the built-in DDR5 test suite (35 tests, consolidated from 87).
# It is compiled INTO the exe (tools/gen_suite.py turns it into src/suite_data.h). The program reads no config at runtime.
# To change tests: edit this file, run `python tools/gen_suite.py`, rebuild.
#
# Format: [default] values are inherited by the [test] blocks that follow. '#' starts a comment. Numbers take 0x / K / M / G.
# Lists (space separated) SWEEP: every combination becomes its own run, so one block covers what used to be many tests.
#
#   algo      fill | march | rwstorm | chase | copy | hammer | probe
#   quick     1 = also part of the "Quick" suite
#   data      pattern (default) | hash | addr          seeds = N hash/addr seeds
#   pattern   list; "0xAAAAAAAA:0x55555555" = alternating beats of the 16-beat burst
#   style     DQ lane styles: sso xtalk half quarter low pulse skew victim walk1 walk0 prbs
#   order / verify_order   list: seq rev stride random bitrev gray butterfly      stride = byte-stride list
#   altshift  list: invert data when bit N of the line index is set (checkerboard scale)     modulo = N list
#   march     "label=elements | label2=elements2".  ^ up  v down  * any;  w0 w1 write;  r0 r1 verify;  D(ms) pause;
#             X(r2) / X(w1) / X(rw3) = disturb: N passes of random traffic on ANOTHER window (needs window_mb)
#   burst     list: lines per op group in a march     dwell_ms   list: pause between write and verify
#   disturb   list of r | w | rw (fill)     disturb_passes     reads = repeated verify passes     both = 1 also inverted data
#   width 8|16|32   nt = 1 streaming stores   flush = 1 clflush every access   cross = 1 verify another thread's chunk
#   window_mb limits each run to a rolling window (each run uses the next window)
#   chase: mlp list   rwstorm: passes   hammer: rowstride aggressors acts rounds   copy: method block

[default]
width = 32
flush = 1

# ======================================================================== addressing / decode
[test]
name = Address-in-address, every access order
algo = march
quick = 1
data = addr
seeds = 2
march = *(w0) ^(r0,w1) v(r1,w0) *(r0)
order = seq rev bitrev gray butterfly random
window_mb = 512

[test]
name = Power-of-2 stride sweep, random verify (every bank / bank-group / row bit)
algo = fill
data = hash
order = stride
verify_order = random
stride = 64 128 256 512 1K 2K 4K 8K 16K 32K 64K 128K 256K 512K 1M 2M
reads = 2
window_mb = 1024

# ======================================================================== data bus / DQ lanes
[test]
name = Solid and checker patterns
algo = fill
quick = 1
pattern = 0x00000000 0xFFFFFFFF 0xAAAAAAAA 0x55555555 0xCCCCCCCC 0x33333333 0xF0F0F0F0 0x0F0F0F0F
both = 1

[test]
name = Walking ones and zeros across 32 DQ lanes
algo = fill
style = walk1 walk0
window_mb = 2048

[test]
name = DQ lane styles: SSO, crosstalk, nyquist, pulse, skew, PRBS7
algo = fill
quick = 1
style = sso xtalk half quarter low pulse skew prbs
altshift = 0
both = 1
window_mb = 512

[test]
name = DQ lane styles, random access order, block inversion
algo = fill
style = xtalk sso prbs
order = random
verify_order = random
altshift = 0 6
both = 1
window_mb = 1024

[test]
name = Single victim lane against aggressors (32 lanes x 6 modes)
algo = fill
style = victim
altshift = 6
window_mb = 256

# ======================================================================== march algorithms
[test]
name = Classic marches, hash data (MATS+ MATS++ X Y C- A B U LR SS PMOVI)
algo = march
data = hash
march = MATS+=*(w0) ^(r0,w1) v(r1,w0) | MATS++=*(w0) ^(r0,w1) v(r1,w0,r0) | March X=*(w0) ^(r0,w1) v(r1,w0) *(r0) | March Y=*(w0) ^(r0,w1,r1) v(r1,w0,r0) *(r0) | March C-=*(w0) ^(r0,w1) ^(r1,w0) v(r0,w1) v(r1,w0) *(r0) | March A=*(w0) ^(r0,w1,w0,w1) ^(r1,w0,w1) v(r1,w0,w1,w0) v(r0,w1,w0) | March B=*(w0) ^(r0,w1,r1,w0,r0,w1) ^(r1,w0,w1) v(r1,w0,w1,w0) v(r0,w1,w0) | March U=*(w0) ^(r0,w1,r1,w0) ^(r0,w1) v(r1,w0,r0,w1) v(r1,w0) | March LR=*(w0) v(r0,w1) ^(r1,w0,r0,w1) ^(r1,w0) ^(r0,w1,r1,w0) ^(r0) | March SS=*(w0) ^(r0,r0,w0,r0,w1) ^(r1,r1,w1,r1,w0) v(r0,r0,w0,r0,w1) v(r1,r1,w1,r1,w0) *(r0) | PMOVI=v(w0) ^(r0,w1,r1) ^(r1,w0,r0) v(r0,w1,r1) v(r1,w0,r0)
window_mb = 512

[test]
name = Classic marches, solid / checker / half-word patterns
algo = march
quick = 1
pattern = 0x00000000 0xAAAAAAAA:0x55555555 0xFFFF0000
march = March C-=*(w0) ^(r0,w1) ^(r1,w0) v(r0,w1) v(r1,w0) *(r0) | MATS+=*(w0) ^(r0,w1) v(r1,w0) | March B=*(w0) ^(r0,w1,r1,w0,r0,w1) ^(r1,w0,w1) v(r1,w0,w1,w0) v(r0,w1,w0)
window_mb = 256

[test]
name = March C-, every access order (seq rev random bitrev gray butterfly stride)
algo = march
data = hash
march = *(w0) ^(r0,w1) ^(r1,w0) v(r0,w1) v(r1,w0) *(r0)
order = seq rev random bitrev gray butterfly stride
stride = 64 256 1K 4K 16K 64K 256K 1M 2M
window_mb = 512

[test]
name = Bus turnaround: read/write switching every 1..64 lines, sequential and random
algo = march
quick = 1
data = hash
march = *(w0) ^(r0,w1) v(r1,w0) *(r0)
burst = 1 2 4 8 16 32 64
order = seq random
window_mb = 1024

[test]
name = Write/read adjacency (tWR tWTR tRTP tRTW): back-to-back on the same line
algo = march
data = hash
march = write-read=*(w0) ^(w1,r1,w0,r0) v(w1,r1,w0,r0) | read-write=*(w0) ^(r0,w1,r1,w0) v(r0,w1,r1,w0)
burst = 1 8
order = seq random
window_mb = 512

[test]
name = Scalar 8-byte accesses
algo = march
data = hash
march = *(w0) ^(r0,w1) v(r1,w0) *(r0)
width = 8
window_mb = 512

[test]
name = SSE2 16-byte accesses with non-temporal stores
algo = march
data = hash
march = *(w0) ^(r0,w1) v(r1,w0) *(r0)
width = 16
nt = 1
window_mb = 512

[test]
name = Normal cached traffic (no clflush: write-back and eviction behaviour)
algo = march
data = hash
march = *(w0) ^(r0,w1) v(r1,w0) *(r0)
flush = 0
window_mb = 512

# ======================================================================== real-world access patterns
[test]
name = Random-order hash soak (every access a row miss)
algo = fill
quick = 1
data = hash
seeds = 6
order = random
verify_order = random
reads = 2
window_mb = 1024

[test]
name = Cross-core verify (data written by another thread / CCD)
algo = fill
data = hash
seeds = 4
order = random
verify_order = rev
cross = 1
window_mb = 1024

[test]
name = Repeated reads, 16 passes (read disturb, back-to-back column bursts)
algo = fill
data = hash
reads = 16
window_mb = 512

[test]
name = Pointer chase with 1 / 2 / 4 / 8 / 16 / 32 parallel chains (latency to max activation rate)
algo = chase
quick = 1
mlp = 1 2 4 8 16 32
seeds = 2
window_mb = 512

[test]
name = Bulk copy engines (memcpy / rep movsb / non-temporal copy)
algo = copy
quick = 1
data = hash

[test]
name = Read/write storm, hash data, random rewrite vs sequential read
algo = rwstorm
quick = 1
data = hash
seeds = 2
passes = 8
window_mb = 1024

[test]
name = Read/write storm, SSO and crosstalk lane patterns
algo = rwstorm
style = sso xtalk half
altshift = 0
passes = 10
window_mb = 1024

[test]
name = Read/write storm, non-temporal stores vs SSE2 reads
algo = rwstorm
data = hash
nt = 1
width = 16
passes = 6
window_mb = 1024

[test]
name = Read/write storm, random on both sides (maximum bank conflicts)
algo = rwstorm
data = hash
order = random
verify_order = random
passes = 4
window_mb = 1024

# ======================================================================== coupling between cells and blocks
[test]
name = Modulo-N coupling (every 3rd / 5th / 8th / 20th line inverted, all offsets)
algo = fill
pattern = 0x00000000 0xFFFFFFFF 0xAAAAAAAA:0x55555555
modulo = 3 5 8 20
window_mb = 256

[test]
name = Checkerboards at line / 4K / 8K / 64K / 2MB scale
algo = fill
quick = 1
pattern = 0x00000000 0xAAAAAAAA:0x55555555
altshift = 0 6 7 10 15
both = 1
window_mb = 512

# ======================================================================== retention, refresh, idle, disturb (manufacturer-style flows)
[test]
name = Passive retention: pause of 2 s and 8 s between write and verify
algo = fill
pattern = 0x00000000 0xAAAAAAAA:0x55555555
both = 1
dwell_ms = 2000 8000
window_mb = 256

[test]
name = Idle gaps of 3 ms and 60 ms between write and verify (power-down entry/exit)
algo = fill
data = hash
seeds = 40
dwell_ms = 3 60
window_mb = 64

[test]
name = Retention march: 5 s pauses, sequential and large-stride order
algo = march
pattern = 0x00000000 0xFFFFFFFF
march = *(w0) D(5000) ^(r0,w1) D(5000) ^(r1,w0) D(5000) *(r0)
order = seq stride
stride = 8K 64K
window_mb = 256

[test]
name = Disturb traffic between write and verify (neighbouring window: read / write / both)
algo = fill
data = hash
seeds = 2
disturb = r w rw
disturb_passes = 3
window_mb = 256

[test]
name = Disturb + passive retention with lane-alternating data
algo = fill
pattern = 0xAAAAAAAA:0x55555555 0x00000000
both = 1
disturb = rw
disturb_passes = 2
dwell_ms = 2000
window_mb = 256

[test]
name = Disturb marches: single disturb phases and disturb between every element
algo = march
data = hash
seeds = 2
march = paper=^(w0) X(rw2) ^(r0,w1) X(rw2) ^(r1,w0) | active=*(w0) X(r2) ^(r0,w1) X(r2) ^(r1,w0) X(r2) v(r0,w1) X(r2) v(r1,w0) X(r2) *(r0)
window_mb = 256

# ======================================================================== row hammer / refresh management
[test]
name = Row hammer, 2 to 14 aggressors, two row strides (TRR / RFM defeat attempts)
algo = hammer
pattern = 0xFFFFFFFF 0xAAAAAAAA:0x55555555
rowstride = 256K 1M
aggressors = 2 4 9 14
acts = 300000
rounds = 8
window_mb = 1024

[test]
name = Activation-count stress: one row pair, 1.5M activations per round
algo = hammer
pattern = 0xFFFFFFFF
rowstride = 256K 1M
aggressors = 2
acts = 1500000
rounds = 8
window_mb = 512

# ======================================================================== informational
[test]
name = Latency by address distance (infers bank hash and tRP+tRCD; no pass/fail)
algo = probe
samples = 20000
