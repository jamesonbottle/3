name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  linux-selftest:
    # Proves the detection logic without DDR5 hardware: unit tests, clean runs (no false positives) and a fault-injection build (planted flips are found).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format check (clang-format 18, see tools/format.sh)
        run: |
          pip install clang-format==18.1.3
          bash tools/format.sh --check
      - name: Engine self-test
        run: bash tools/selftest.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: cmd
        run: build.bat
      - name: Smoke test (console build, quick suite, 64 MB)
        shell: cmd
        run: build\ddr5test_cli.exe -mb 64 -t 2 --quick --minutes 1 --no-large-pages
      - uses: actions/upload-artifact@v4
        with:
          name: ddr5ramtest
          path: |
            build/ddr5ramtest.exe
            build/ddr5test_cli.exe
